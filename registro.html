<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario - CollectorVault</title>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
    <header class="navbar">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="logo">Collector<span>Vault</span></h1>
            <nav>
                <ul class="nav-links d-flex">
                    <li><a href="index.html" class="nav-item">HOME</a></li>
                    <li><a href="productos.html" class="nav-item">PRODUCTOS</a></li>
                    <li><a href="nosotros.html" class="nav-item">QUIENES SOMOS</a></li>
                    <li><a href="login.html" class="nav-item">INICIAR SESIÓN</a></li>
                    <li><a href="carrito.html" class="nav-item">🛒 CARRITO (0)</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container mt-5" style="max-width: 600px;">
        <section
            style="background: white; padding: 40px; border-radius: 4px; border: 1px solid #E0E0E0; box-shadow: 0 4px 6px rgba(0,0,0,0.02);">
            <h2 class="text-center mb-4"
                style="text-transform: uppercase; border-bottom: 3px solid var(--accent-yellow); padding-bottom: 10px;">
                Registro de Usuario
            </h2>

            <form id="form-registro">
                <div style="margin-bottom: 15px;">
                    <label for="run" style="display:block; font-weight:bold; margin-bottom:5px;">RUN (Sin puntos ni
                        guion):</label>
                    <input type="text" id="run" class="w-100" placeholder="Ej: 19011022K"
                        style="padding: 10px; border:1px solid #ccc; border-radius:4px;" required>
                </div>

                <div style="margin-bottom: 15px;">
                    <label for="nombre" style="display:block; font-weight:bold; margin-bottom:5px;">NOMBRE
                        COMPLETO:</label>
                    <input type="text" id="nombre" class="w-100"
                        style="padding: 10px; border:1px solid #ccc; border-radius:4px;" required>
                </div>

                <div style="margin-bottom: 15px;">
                    <label for="correo" style="display:block; font-weight:bold; margin-bottom:5px;">CORREO
                        ELECTRÓNICO:</label>
                    <input type="email" id="correo" class="w-100" placeholder="usuario@gmail.com o @7shinobi.cl"
                        style="padding: 10px; border:1px solid #ccc; border-radius:4px;" required>
                </div>

                <div style="margin-bottom: 15px;">
                    <label for="password" style="display:block; font-weight:bold; margin-bottom:5px;">CONTRASEÑA (8 a 32
                        caracteres):</label>
                    <input type="password" id="password" class="w-100"
                        style="padding: 10px; border:1px solid #ccc; border-radius:4px;" required>
                </div>

                <div style="margin-bottom: 15px;">
                    <label for="telefono" style="display:block; font-weight:bold; margin-bottom:5px;">TELÉFONO
                        (Opcional):</label>
                    <input type="tel" id="telefono" class="w-100"
                        style="padding: 10px; border:1px solid #ccc; border-radius:4px;">
                </div>

                <!-- Selectores con IDs sincronizados con main.js -->
                <div style="display: flex; gap: 15px; margin-bottom: 20px;">
                    <div style="flex: 1;">
                        <label for="select-region"
                            style="display:block; font-weight:bold; margin-bottom:5px;">REGIÓN:</label>
                        <select id="select-region" class="w-100"
                            style="padding: 10px; border:1px solid #ccc; border-radius:4px;">
                            <option value="">Seleccione Región</option>
                            <option value="RM">Región Metropolitana</option>
                            <option value="VS">Región de Valparaíso</option>
                            <option value="AR">Región de La Araucanía</option>
                        </select>
                    </div>
                    <div style="flex: 1;">
                        <label for="select-comuna"
                            style="display:block; font-weight:bold; margin-bottom:5px;">COMUNA:</label>
                        <select id="select-comuna" class="w-100"
                            style="padding: 10px; border:1px solid #ccc; border-radius:4px;">
                            <option value="">Seleccione Comuna</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100"
                    style="padding: 12px; font-size: 1rem;">Registrarse</button>
            </form>
        </section>
    </main>

    <footer class="footer mt-5 text-center">
        <div class="container">
            <p style="color: var(--text-muted);">&copy; 2026 CollectorVault</p>
        </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/validaciones.js"></script>
    <script src="js/catalogo.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
