<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Carrito de Compras - CollectorVault</title>
    <link rel="stylesheet" href="styles/style.css">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tu hoja de estilos personalizada (debe ir DESPUÉS de Bootstrap para poder sobrescribir estilos) -->
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
    <header class="navbar">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="logo">Collector<span>Vault</span></h1>
            <nav>
                <ul class="nav-links d-flex">
                    <li><a href="index.html" class="nav-item">HOME</a></li>
                    <li><a href="productos.html" class="nav-item">PRODUCTOS</a></li>
                    <li><a href="nosotros.html" class="nav-item">QUIENES SOMOS</a></li>
                    <li><a href="login.html" class="nav-item">INICIAR SESIÓN</a></li>
                    <li><a href="carrito.html" class="nav-item active">🛒 CARRITO (0)</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container mt-5">
        <h2
            style="margin-bottom: 25px; text-transform: uppercase; border-left: 4px solid var(--accent-yellow); padding-left: 10px;">
            Mi Carrito de Compras
        </h2>

        <div class="row">

            <!-- Contenedor dinámico de ítems (Vacío para inyección con JS) -->
            <div class="col-md-8" id="contenedor-carrito-items" style="width: 65%;"></div>

            <!-- Resumen de pago -->
            <div class="col-md-4" style="width: 35%;">
                <div style="background: white; padding: 25px; border-radius: 4px; border: 1px solid #E0E0E0;">
                    <h3 style="font-size: 1.3rem; margin-bottom: 20px; text-transform: uppercase;">Resumen de Pago</h3>

                    <div style="margin-bottom: 20px;">
                        <label for="cupon"
                            style="font-size: 0.9rem; display: block; margin-bottom: 5px; color: var(--text-muted);">
                            ¿Tienes un cupón de descuento?
                        </label>
                        <div style="display: flex; gap: 10px;">
                            <input type="text" id="cupon" placeholder="Ingresa código"
                                style="flex-grow: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                            <button class="btn"
                                style="background-color: #333; color: white; padding: 8px 12px; font-size: 0.8rem;">Aplicar</button>
                        </div>
                    </div>

                    <hr style="border: none; border-top: 1px solid #eee; margin-bottom: 20px;">

                    <div class="d-flex justify-content-between align-items-center" style="margin-bottom: 25px;">
                        <span style="font-size: 1.2rem; font-weight: bold;">TOTAL:</span>
                        <span id="total-carrito"
                            style="font-size: 1.6rem; font-weight: 900; color: var(--accent-blue);">$0</span>
                    </div>

                    <button onclick="procesarPago()" class="btn w-100"
                        style="background-color: #00E676; color: #000; padding: 15px; font-size: 1.1rem;">
                        PAGAR
                    </button>
                </div>
            </div>

        </div>
    </main>

    <footer style="background-color: #FFFFFF; border-top: 1px solid #E0E0E0; padding: 2rem 0;" class="mt-5 text-center">
        <div class="container">
            <p style="color: var(--text-muted);">&copy; 2026 CollectorVault</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Tus scripts modulares -->
    <script src="js/data.js"></script>
    <script src="js/validaciones.js"></script>
    <script src="js/catalogo.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
