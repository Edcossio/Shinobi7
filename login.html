<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - CollectorVault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
    <header class="navbar navbar-expand-lg bg-white border-bottom border-dark border-3">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="logo mb-0">Collector<span>Vault</span></h1>
            <nav>
                <ul class="nav-links d-flex mb-0">
                    <li><a href="index.html" class="nav-item">HOME</a></li>
                    <li><a href="productos.html" class="nav-item">PRODUCTOS</a></li>
                    <li><a href="nosotros.html" class="nav-item">QUIENES SOMOS</a></li>
                    <li><a href="login.html" class="nav-item active">INICIAR SESIÓN</a></li>
                    <li><a href="carrito.html" class="nav-item">🛒 CARRITO (0)</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-5" style="max-width: 480px;">
        <div class="card p-4 shadow-sm border-2">
            <h2 class="title-accent text-center mb-4">Iniciar Sesión</h2>
            <form id="form-login">
                <div class="mb-3">
                    <label for="correo" class="form-label fw-bold">CORREO ELECTRÓNICO:</label>
                    <input type="email" id="correo" class="form-control form-control-lg border-2 border-dark"
                        placeholder="ejemplo@duoc.cl" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label fw-bold">CONTRASEÑA:</label>
                    <input type="password" id="password" class="form-control form-control-lg border-2 border-dark"
                        placeholder="8 a 32 caracteres" required>
                </div>

                <!-- Enlace de Recuperación y Checkbox Recordarme -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input border-2 border-dark" type="checkbox" id="remember">
                        <label class="form-check-label small fw-bold" for="remember">Recordarme</label>
                    </div>
                    <a href="#" onclick="solicitarRecuperacion(event)"
                        class="small fw-bold text-decoration-none text-primary">
                        ¿Olvidaste tu contraseña?
                    </a>
                </div>

                <button type="submit" class="btn btn-primary w-100 btn-lg fw-bold">Ingresar</button>
            </form>
            <div class="text-center mt-4 pt-3 border-top border-dashed">
                <p class="text-muted mb-2">¿Aún no tienes una cuenta?</p>
                <a href="registro.html" class="btn btn-warning fw-bold text-dark border-2 border-dark">¡Regístrate
                    aquí!</a>
            </div>
        </div>
    </main>

    <footer class="footer text-center mt-5">
        <div class="container">
            <p class="text-muted mb-0">&copy; 2026 CollectorVault</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/validaciones.js"></script>
    <script src="js/catalogo.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
