<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Productos - CollectorVault</title>
	<!-- Bootstrap 5.3 CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<!-- Estilos personalizados -->
	<link rel="stylesheet" href="styles/style.css">
</head>

<body>

	<!-- Encabezado Estandarizado -->
	<header class="navbar navbar-expand-lg bg-white border-bottom border-dark border-3">
		<div class="container d-flex justify-content-between align-items-center">
			<h1 class="logo mb-0">Collector<span>Vault</span></h1>
			<nav>
				<ul class="nav-links d-flex mb-0">
					<li><a href="index.html" class="nav-item">HOME</a></li>
					<li><a href="productos.html" class="nav-item active">PRODUCTOS</a></li>
					<li><a href="nosotros.html" class="nav-item">QUIENES SOMOS</a></li>
					<li><a href="login.html" class="nav-item">INICIAR SESIÓN</a></li>
					<li><a href="carrito.html" class="nav-item">🛒 CARRITO (0)</a></li>
				</ul>
			</nav>
		</div>
	</header>

	<!-- Contenido Principal -->
	<main class="container mt-5">

		<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
			<h2 class="title-accent mb-0">Catálogo de Figuras</h2>
			<!-- Iniciamos el contador oculto con d-none -->
			<span id="contador-productos"
				class="badge bg-dark text-white border border-dark border-2 fw-black text-uppercase px-3 py-2 d-none">
				0 FIGURAS ENCONTRADAS
			</span>
		</div>

		<!-- BARRA DE BÚSQUEDA Y FILTROS NEO-BRUTALISTA -->
		<section class="card p-3 mb-5 border-3 shadow-sm bg-white">
			<div class="row g-3 align-items-center">
				<!-- BUSCADOR -->
				<div class="col-12 col-md-5">
					<label for="buscar-producto" class="form-label fw-bold text-uppercase small mb-1">Buscar
						Figura:</label>
					<input type="text" id="buscar-producto" class="form-control border-3 border-dark fw-bold"
						placeholder="Ej: Rem, Gojo, Good Smile..." oninput="filtrarProductos()">
				</div>

				<!-- FILTRO CATEGORÍA -->
				<div class="col-12 col-sm-6 col-md-3">
					<label for="filtro-categoria"
						class="form-label fw-bold text-uppercase small mb-1">Categoría:</label>
					<select id="filtro-categoria" class="form-select border-3 border-dark fw-bold"
						onchange="filtrarProductos()">
						<option value="">TODAS LAS CATEGORÍAS</option>
						<option value="Pokemon">POKÉMON</option>
						<option value="Anime">ANIME</option>
						<option value="Vocaloid">VOCALOID</option>
					</select>
				</div>

				<!-- ORDENAR POR PRECIO -->
				<div class="col-12 col-sm-6 col-md-4">
					<label for="orden-precio" class="form-label fw-bold text-uppercase small mb-1">Ordenar por:</label>
					<select id="orden-precio" class="form-select border-3 border-dark fw-bold"
						onchange="filtrarProductos()">
						<option value="defecto">ORDEN POR DEFECTO</option>
						<option value="menor-mayor">PRECIO: MENOR A MAYOR</option>
						<option value="mayor-menor">PRECIO: MAYOR A MENOR</option>
					</select>
				</div>
			</div>
		</section>

		<!-- GRILLA DE PRODUCTOS (3 COLUMNAS EN DESKTOP) -->
		<section class="row g-4" id="contenedor-productos">
			<!-- JavaScript inyectará aquí los artículos dinámicamente -->
		</section>

	</main>

	<!-- Pie de Página -->
	<footer class="footer mt-5 text-center">
		<div class="container">
			<p style="color: var(--text-muted);">&copy; 2026 CollectorVault</p>
		</div>
	</footer>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

	<!-- Scripts Modulares -->
	<script src="js/data.js"></script>
	<script src="js/validaciones.js"></script>
	<script src="js/catalogo.js"></script>
	<script src="js/carrito.js"></script>
	<script src="js/main.js"></script>
</body>

</html>
