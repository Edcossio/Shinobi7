<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CollectorVault - Gestión de Usuarios</title>
    <link rel="stylesheet" href="styles/admin.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>

    <header class="zte-topbar">
        <div>CollectorVault</div>
        <div class="zte-model">F680_v2.0</div>
    </header>

    <div class="zte-wrapper">
        <aside class="admin-sidebar">
            <ul class="admin-nav">
                <li class="nav-cat-title nav-group-active">- Administración</li>
                <li><a href="admin_home.html" class="admin-nav-link"> Dashboard</a></li>
                <li><a href="admin_productos.html" class="admin-nav-link"> Gestión Productos</a></li>
                <li><a href="admin_usuarios.html" class="admin-nav-link active"> Gestión Usuarios</a></li>
                <hr class="text-white-50 my-2">
                <li><a href="index.html" class="admin-nav-link"> Volver al Home</a></li>
            </ul>
        </aside>

        <main class="admin-main">
            <div class="zte-breadcrumb">
                <span>Ruta: Administración - Gestión de Usuarios</span>
                <a href="#" id="btn-cerrar-sesion-top">Cerrar Sesión</a>
            </div>

            <div class="zte-content">
                <!-- FORMULARIO CRUD USUARIOS -->
                <section class="zte-panel mb-4">
                    <h3 id="titulo-form-usuario">Añadir Usuario</h3>
                    <form id="form-admin-usuario">
                        <input type="hidden" id="user-index-edit" value="-1">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="user-run">RUN (Sin puntos ni guion):</label>
                                <input type="text" id="user-run" class="form-control" placeholder="19011022K" required>
                            </div>
                            <div class="form-group">
                                <label for="user-nombre">Nombre Completo:</label>
                                <input type="text" id="user-nombre" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="user-correo">Correo Electrónico:</label>
                                <input type="email" id="user-correo" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="user-password">Contraseña:</label>
                                <input type="password" id="user-password" class="form-control"
                                    placeholder="Mínimo 8 caracteres">
                            </div>
                            <div class="form-group">
                                <label for="user-rol">Rol Asignado:</label>
                                <select id="user-rol" class="form-select border-2 border-dark fw-bold" required>
                                    <option value="Cliente">Cliente</option>
                                    <option value="Vendedor">Vendedor</option>
                                    <option value="Administrador">Administrador</option>
                                </select>
                            </div>
                        </div>
                        <div class="mt-3">
                            <button type="submit" id="btn-submit-usuario" class="btn-admin btn-admin-primary">Guardar
                                Usuario</button>
                            <button type="button" id="btn-cancelar-usuario" class="btn btn-secondary"
                                style="display: none;" onclick="resetFormUsuario()">Cancelar</button>
                        </div>
                    </form>
                </section>

                <!-- TABLA DE USUARIOS EN ESPAÑOL -->
                <section class="zte-panel">
                    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                        <h3 class="mb-0">Lista de Usuarios y Control de Acceso</h3>
                        <div style="max-width: 320px; width: 100%;">
                            <input type="text" id="buscar-admin-usuario"
                                class="form-control form-control-sm border-2 border-dark"
                                placeholder=" Buscar por nombre, RUN o correo..." oninput="filtrarTablaUsuarios()">
                        </div>
                    </div>

                    <div class="admin-table-container">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>RUN</th>
                                    <th>Nombre Completo</th>
                                    <th>Correo Electrónico</th>
                                    <th>Rol Asignado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-admin-usuarios"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="js/finalSesion.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/validaciones.js"></script>
    <script src="js/catalogo.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/main.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
