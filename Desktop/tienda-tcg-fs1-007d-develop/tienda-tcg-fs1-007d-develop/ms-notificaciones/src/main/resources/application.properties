

# Nombre y Puerto
spring.application.name=ms-notificaciones
server.port=8092

# 1. SEGURIDAD H2: Habilitada solo localmente (sin permitir accesos externos)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# 2. BASE DE DATOS: Modo validación (mas seguro para producción)
spring.datasource.url=jdbc:h2:mem:notificacionesdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# 3. HIBERNATE: Desactivamos SQL detallado y cambiamos update por validate/update
spring.jpa.hibernate.ddl-auto=update

# 4. EUREKA: Configuración necesaria para que el servicio se registre
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# SWAGGER (Se mantiene igual)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html