# 1. Identificación del Microservicio
spring.application.name=ms-usuarios
server.port=8081

# 2. Configuración de Oracle con Wallet
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@proyectotcg_high?TNS_ADMIN=C:/w_proyecto
spring.datasource.username=user_ms_usuarios
spring.datasource.password=Duocuc12345.

# 3. JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 4. Registro en Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

logging.level.feign=DEBUG

springdoc.enable-hateoas=false