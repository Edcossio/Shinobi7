spring.application.name=ms-pagos
server.port=8083

#config de oracle con wallet
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@proyectotcg_high?TNS_ADMIN=C:/w_proyecto
spring.datasource.username=user_ms_pagos
spring.datasource.password=Duocuc12345.

# JPA
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1

#Feign timeouts 
feign.client.config.default.connect-timeout=3000
feign.client.config.default.read-timeout=5000

#Resilience4j Circuit Breaker
feign.circuitbreaker.enabled=true

resilience4j.circuitbreaker.instances.ms-auth.sliding-window-size=10
resilience4j.circuitbreaker.instances.ms-auth.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ms-auth.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.ms-auth.permitted-number-of-calls-in-half-open-state=3

resilience4j.circuitbreaker.instances.ms-pedidos.sliding-window-size=10
resilience4j.circuitbreaker.instances.ms-pedidos.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ms-pedidos.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.ms-pedidos.permitted-number-of-calls-in-half-open-state=3

springdoc.enable-hateoas=false