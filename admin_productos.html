<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CollectorVault - Item Inventory</title>
    <link rel="stylesheet" href="styles/admin.css">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tu hoja de estilos personalizada (debe ir DESPUÉS de Bootstrap para poder sobrescribir estilos) -->
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>

    <header class="zte-topbar">
        <div>CollectorVault</div>
        <div class="zte-model">F680_v2.0</div>
    </header>

    <div class="zte-wrapper">
        <aside class="admin-sidebar">
            <ul class="admin-nav">
                <li class="nav-cat-title nav-group-active">-Administracion</li>
                <li><a href="admin_home.html" class="admin-nav-link"> Dashboard</a></li>
                <li><a href="admin_productos.html" class="admin-nav-link"> Gestion Productos</a></li>
                <li><a href="admin_usuarios.html" class="admin-nav-link active"> Gestion Usuarios</a></li>
                <li><a href="index.html" class="admin-nav-link logout"> Cerrar Sesión</a></li>
            </ul>
        </aside>

        <main class="admin-main">
            <div class="zte-breadcrumb">
                <span>Path: Administration - Item Inventory</span>
                <a href="index.html">Logout</a>
            </div>

            <div class="zte-content">
                <section class="zte-panel">
                    <h3>Add Item Configuration</h3>
                    <form id="form-admin-producto">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="prod-codigo">Code (min. 3 chars):</label>
                                <input type="text" id="prod-codigo" class="form-control" placeholder="FIG-000" required>
                            </div>
                            <div class="form-group">
                                <label for="prod-nombre">Product Name:</label>
                                <input type="text" id="prod-nombre" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="prod-precio">Price (CLP):</label>
                                <input type="number" id="prod-precio" min="0" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="prod-stock">Stock Units:</label>
                                <input type="number" id="prod-stock" min="0" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="prod-critico">Critical Limit:</label>
                                <input type="number" id="prod-critico" min="1" value="3" class="form-control" required>
                            </div>
                        </div>
                        <button type="submit" class="btn-admin btn-admin-primary">Submit / Apply</button>
                    </form>
                </section>

                <section class="zte-panel">
                    <h3>Inventory Table</h3>
                    <div class="admin-table-container">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Code</th>
                                    <th>Product Name</th>
                                    <th>Price</th>
                                    <th>Stock</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-admin-productos"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Tus scripts modulares -->
    <script src="js/data.js"></script>
    <script src="js/validaciones.js"></script>
    <script src="js/catalogo.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
