<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CollectorVault - Gestión de Productos</title>
    <link rel="stylesheet" href="styles/admin.css">
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>

    <!-- ENCABEZADO -->
    <header class="zte-topbar">
        <div>CollectorVault</div>
        <div class="zte-model">
            F680_v2.0
        </div>
    </header>

    <div class="zte-wrapper">

        <!-- MENÚ LATERAL -->
        <aside class="admin-sidebar">
            <ul class="admin-nav">
                <li class="nav-cat-title nav-group-active">- Administracion</li>
                <li><a href="admin_home.html" class="admin-nav-link"> Dashboard</a></li>
                <li><a href="admin_productos.html" class="admin-nav-link"> Gestion Productos</a></li>
                <li><a href="admin_usuarios.html" class="admin-nav-link active"> Gestion Usuarios</a></li>
                <hr class="text-white-50 my-2">
                <li><a href="index.html" class="admin-nav-link"> Volver al Home</a></li>
            </ul>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="admin-main">

            <div class="zte-breadcrumb">
                <span>Path: Administration - System Management</span>
                <a href="#" id="btn-cerrar-sesion-top">Logout</a>
            </div>
            <div class="zte-content">

                <!-- FORMULARIO -->
                <section class="zte-panel">
                    <h3 id="titulo-form-producto">
                        Add Item Configuration
                    </h3>

                    <form id="form-admin-producto">
                        <div class="form-grid">

                            <!-- CÓDIGO -->
                            <div class="form-group">
                                <label for="prod-codigo">
                                    Code (min. 3 chars):
                                </label>
                                <input type="text" id="prod-codigo" class="form-control" placeholder="FIG-000"
                                    minlength="3" required>
                            </div>

                            <!-- NOMBRE -->
                            <div class="form-group">
                                <label for="prod-nombre">
                                    Product Name:
                                </label>
                                <input type="text" id="prod-nombre" class="form-control" required>
                            </div>

                            <!-- PRECIO -->
                            <div class="form-group">
                                <label for="prod-precio">
                                    Price (CLP):
                                </label>
                                <input type="number" id="prod-precio" class="form-control" min="0" required>
                            </div>

                            <!-- STOCK -->
                            <div class="form-group">
                                <label for="prod-stock">
                                    Stock Units:
                                </label>
                                <input type="number" id="prod-stock" class="form-control" min="0" required>
                            </div>

                            <!-- STOCK CRÍTICO -->
                            <div class="form-group">
                                <label for="prod-critico">
                                    Critical Limit:
                                </label>
                                <input type="number" id="prod-critico" class="form-control" min="1" value="3" required>
                            </div>

                        </div>

                        <!-- BOTÓN PRINCIPAL -->
                        <button type="submit" id="btn-submit-producto" class="btn-admin btn-admin-primary">
                            Agregar Producto
                        </button>

                        <!-- CANCELAR EDICIÓN -->
                        <button type="button" id="btn-cancelar-edicion" class="btn btn-secondary"
                            style="display: none;">
                            Cancelar
                        </button>
                    </form>
                </section>

                <!-- TABLA -->
                <section class="zte-panel">
                    <h3>
                        Inventory Table
                    </h3>

                    <div class="admin-table-container">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Code</th>
                                    <th>Product Name</th>
                                    <th>Price</th>
                                    <th>Stock</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-admin-productos">
                            </tbody>
                        </table>
                    </div>
                </section>

            </div>

        </main>

    </div>

    <!-- Script específico para manejar el cierre de sesión seguro desde el panel -->
    <script src="js/finalSesion.js"></script>

    <!-- BOOTSTRAP -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- ARCHIVOS JAVASCRIPT -->
    <script src="js/data.js"></script>
    <script src="js/validaciones.js"></script>
    <script src="js/catalogo.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/main.js"></script>
    <!-- IMPORTANTE: ADMIN.JS VA AL FINAL -->
    <script src="js/admin.js"></script>

</body>

</html>
