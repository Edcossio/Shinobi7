<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - CollectorVault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
    <header class="navbar navbar-expand-lg bg-white border-bottom border-dark border-3">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="logo mb-0">Collector<span>Vault</span></h1>
            <nav>
                <ul class="nav-links d-flex mb-0">
                    <li><a href="index.html" class="nav-item">HOME</a></li>
                    <li><a href="productos.html" class="nav-item">PRODUCTOS</a></li>
                    <li><a href="nosotros.html" class="nav-item">QUIENES SOMOS</a></li>
                    <li><a href="login.html" class="nav-item">INICIAR SESIÓN</a></li>
                    <li><a href="carrito.html" class="nav-item">🛒 CARRITO (0)</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-5" style="max-width: 600px;">
        <div class="card p-4 shadow-sm border-2">
            <h2 class="title-accent text-center mb-4">Formulario de Contacto</h2>
            <form id="form-contacto">
                <div class="mb-3">
                    <label for="nombre-contacto" class="form-label fw-bold">NOMBRE COMPLETO:</label>
                    <input type="text" id="nombre-contacto" class="form-control border-2 border-dark" maxlength="100"
                        required>
                </div>
                <div class="mb-3">
                    <label for="correo-contacto" class="form-label fw-bold">CORREO ELECTRÓNICO:</label>
                    <input type="email" id="correo-contacto" class="form-control border-2 border-dark"
                        placeholder="usuario@duoc.cl o @gmail.com" required>
                </div>
                <div class="mb-4">
                    <label for="comentario" class="form-label fw-bold">COMENTARIO (Máx. 500 caracteres):</label>
                    <textarea id="comentario" class="form-control border-2 border-dark" rows="5" maxlength="500"
                        required></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-lg fw-bold">Enviar Mensaje</button>
            </form>
        </div>
    </main>

    <footer class="footer text-center mt-5">
        <div class="container">
            <p class="text-muted mb-0">&copy; 2026 CollectorVault</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/validaciones.js"></script>
    <script src="js/catalogo.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
