<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - CollectorVault</title>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>

    <header class="navbar">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="logo">Collector<span>Vault</span></h1>
            <nav>
                <ul class="nav-links d-flex">
                    <li><a href="index.html" class="nav-item">HOME</a></li>
                    <li><a href="productos.html" class="nav-item">PRODUCTOS</a></li>
                    <li><a href="nosotros.html" class="nav-item">QUIENES SOMOS</a></li>
                    <li><a href="login.html" class="nav-item">INICIAR SESIÓN</a></li>
                    <li><a href="carrito.html" class="nav-item">🛒 CARRITO (0)</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container mt-5" style="max-width: 600px;">
        <section style="background: white; padding: 40px; border-radius: 4px; border: 1px solid #E0E0E0;">
            <h2 class="text-center mb-4"
                style="text-transform: uppercase; border-bottom: 3px solid var(--accent-yellow); padding-bottom: 10px;">
                Formulario de Contacto
            </h2>
            <form id="form-contacto">
                <div style="margin-bottom: 15px;">
                    <label for="nombre-contacto" style="display:block; font-weight:bold; margin-bottom:5px;">NOMBRE
                        COMPLETO:</label>
                    <input type="text" id="nombre-contacto" class="w-100" maxlength="100"
                        style="padding: 10px; border:1px solid #ccc; border-radius:4px;" required>
                </div>
                <div style="margin-bottom: 15px;">
                    <label for="correo-contacto" style="display:block; font-weight:bold; margin-bottom:5px;">CORREO
                        ELECTRÓNICO:</label>
                    <input type="email" id="correo-contacto" class="w-100" maxlength="100"
                        placeholder="@duoc.cl, @profesor.duoc.cl o @gmail.com"
                        style="padding: 10px; border:1px solid #ccc; border-radius:4px;" required>
                </div>
                <div style="margin-bottom: 20px;">
                    <label for="comentario" style="display:block; font-weight:bold; margin-bottom:5px;">COMENTARIO (Máx.
                        500 caracteres):</label>
                    <textarea id="comentario" class="w-100" rows="5" maxlength="500"
                        style="padding: 10px; border:1px solid #ccc; border-radius:4px;" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100">Enviar Mensaje</button>
            </form>
        </section>
    </main>

    <footer style="background-color: #FFFFFF; border-top: 1px solid #E0E0E0; padding: 2rem 0;" class="mt-5 text-center">
        <div class="container">
            <p style="color: var(--text-muted);">&copy; 2026 CollectorVault</p>
        </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/validaciones.js"></script>
    <script src="js/catalogo.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
